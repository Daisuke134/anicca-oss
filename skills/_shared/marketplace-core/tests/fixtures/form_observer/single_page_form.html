<!doctype html>
<html>
<body>
<form id="contact-form">
  <div class="field-row">
    <label>お名前</label>
    <input type="text" name="full_name" required>
  </div>
  <div class="field-row">
    <label>メールアドレス</label>
    <input type="email" name="email" required>
  </div>
  <div class="field-row">
    <label>お問い合わせ内容</label>
    <textarea name="message" required></textarea>
  </div>
  <button type="submit">送信する</button>
</form>
</body>
</html>
