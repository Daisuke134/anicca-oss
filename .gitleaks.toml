# Anicca OSS gitleaks config — allowlist env-var refs, placeholders, API-doc examples.
# These are NOT real secrets (verified 2026-05-24): curl uses $ENV_VARS, docs show
# YOUR_TOKEN / <placeholder>, reference/*.md describe API fields.
[extend]
useDefault = true

[[allowlists]]
description = "env var references and placeholder tokens in examples/docs"
regexTarget = "match"
regexes = [
  '''\$\{?[A-Za-z_][A-Za-z0-9_]*\}?''',
  '''YOUR_[A-Z0-9_]+''',
  '''<[A-Za-z0-9_ .:/-]+>''',
  '''(?i)example|placeholder|your-|changeme|xxxx''',
  '''e66dc8de6083d2d2d716d99a81358e2672d965c07cbff1f923c86703172c4c9d''',
  '''LM_ANICCA_JP4_TIKTOK_APPROVAL_REF''',
]

[[allowlists]]
description = "API reference docs and example files (descriptions, not secrets)"
paths = [
  '''.*/references/.*\.md''',
  '''.*\.example(\..*)?''',
  '''.*/SKILL\.md''',
]

[[allowlists]]
description = "public on-chain contract addresses (NOT secrets — anyone can look them up on basescan.org / etherscan.io)"
regexTarget = "match"
regexes = [
  '''0x[0-9a-fA-F]{40}''',
  '''0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913''',
  '''0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48''',
  '''0x41f97480aA37844482Af7c8537A92092a7A72EC2''',
  '''0x4D97DCd97eC945f40cF65F87097ACe5EA0476045''',
]
stopwords = [
  "token_contract",
  "contract_address",
  "BASE_USDC",
]

[[allowlists]]
description = "anicca-earn-x402 files that hard-code the public USDC token contract"
paths = [
  '''skills/anicca-earn-x402/workers/src/index\.ts''',
  '''skills/anicca-earn-x402/deploy/netlify/functions/x402\.js''',
]
